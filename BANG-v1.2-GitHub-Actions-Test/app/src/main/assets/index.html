<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b18">
<title>BANG — Friends, Nearby.</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#f7f8ff;background:radial-gradient(circle at top,#202653 0,#090b18 48%,#05060d 100%)}button,input{font:inherit}button{cursor:pointer}.shell{width:min(1100px,96vw);margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:34px;font-weight:950;letter-spacing:-1px}.pill{padding:8px 12px;border:1px solid #ffffff20;border-radius:999px;background:#ffffff0b;color:#b8c0dd;font-size:13px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px}.panel,.chatbox,.auth{border:1px solid #ffffff15;border-radius:26px;background:#ffffff09;box-shadow:0 25px 70px #0007;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.panel{padding:18px}.profile{padding:14px;border:1px solid #ffffff14;border-radius:18px;background:linear-gradient(135deg,#6d5dfc33,#24d5ff18)}.profile-row{display:flex;align-items:center;gap:12px}.avatar{display:grid;width:52px;height:52px;flex:0 0 auto;place-items:center;border-radius:16px;background:linear-gradient(135deg,#7c6cff,#36d1dc);font-size:24px;font-weight:900}.muted{color:#9ba5c4;font-size:13px}.small{font-size:12px}.nav{display:grid;gap:8px;margin-top:18px}.nav button{width:100%;padding:12px;border:0;border-radius:13px;background:transparent;color:#cfd5eb;font-weight:700;text-align:left}.nav button:hover,.nav button.active{background:#ffffff12;color:#fff}.chatbox{display:flex;flex-direction:column;min-height:72vh;overflow:hidden}.chat-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #ffffff12}.title{font-size:20px;font-weight:850}.messages{flex:1;min-height:380px;padding:20px;overflow:auto}.msg{max-width:72%;margin:9px 0;padding:11px 14px;border:1px solid #ffffff0c;border-radius:17px;background:#ffffff0d;overflow-wrap:anywhere}.msg.me{margin-left:auto;border:0;background:linear-gradient(135deg,#6658e8,#3b82f6)}.meta{margin-bottom:4px;color:#aeb7d1;font-size:11px}.composer{display:flex;gap:9px;padding:14px;border-top:1px solid #ffffff12}.composer input,.field{width:100%;padding:13px;border:1px solid #ffffff18;border-radius:14px;outline:none;background:#050811;color:#fff}.composer input:focus,.field:focus{border-color:#7c6cff}.btn{padding:12px 16px;border:0;border-radius:14px;background:#fff;color:#111;font-weight:850;cursor:pointer}.btn:disabled{cursor:not-allowed;opacity:.5}.secondary{border:1px solid #ffffff18;background:#ffffff12;color:#fff}.join,.actions{display:flex;flex-wrap:wrap;gap:8px}.notice{margin:14px 20px 0;padding:11px 13px;border-radius:13px;background:#f59e0b15;color:#ffd78b;font-size:12px}.auth{max-width:520px;margin:8vh auto;padding:28px}.auth h1{margin:0 0 8px}.form{display:grid;gap:10px;margin-top:18px}.card{margin-top:12px;padding:16px;border:1px solid #ffffff12;border-radius:18px;background:#ffffff07}.list{display:grid;gap:8px;margin-top:10px}.friend{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px;border-radius:12px;background:#ffffff08}.hidden{display:none}.danger{color:#ffb4b4}.code{font-size:22px;font-weight:900;letter-spacing:2px;word-break:break-all}.toggle{cursor:pointer;color:#9fdcff}.toast{position:fixed;bottom:22px;left:50%;display:none;transform:translateX(-50%);padding:12px 16px;border:1px solid #ffffff18;border-radius:14px;background:#161a2c;z-index:10000}@media(max-width:760px){.layout{grid-template-columns:1fr}.panel{display:none}.shell{width:100%;padding:12px}.chatbox{min-height:86vh}.brand{font-size:28px}.messages{min-height:450px}.msg{max-width:85%}.top{align-items:flex-start;flex-direction:column;gap:10px}}
</style>
</head>
<body><div class="shell" id="app"></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let token=localStorage.getItem('bang_token')||'',me=null,ws=null,API=localStorage.getItem('bang_api')||'';API=API.replace(/\/$/,'');try{me=JSON.parse(localStorage.getItem('bang_user')||'null')}catch{localStorage.removeItem('bang_user')}
function toast(message){const e=$('toast');if(!e)return;e.textContent=message;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2600)}
function save(){localStorage.setItem('bang_token',token);localStorage.setItem('bang_user',JSON.stringify(me))}
function setApi(){const input=$('api');if(!input)return;API=input.value.trim().replace(/\/$/,'');if(API&&!/^https?:\/\//i.test(API))API='http://'+API;localStorage.setItem('bang_api',API)}
async function api(path,options={}){if(!API)throw new Error('Set the BANG server address first.');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),15000);try{options.headers={...(options.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const response=await fetch(API+path,{...options,signal:controller.signal});let data={};try{data=await response.json()}catch{}if(!response.ok){if(response.status===401){token='';me=null;localStorage.removeItem('bang_token');localStorage.removeItem('bang_user')}throw new Error(data.error||`Server error (${response.status})`)}return data}catch(e){if(e.name==='AbortError')throw new Error('Server took too long to respond. Check the address and that the server is running.');if(e instanceof TypeError)throw new Error('Cannot reach the BANG server. Check Wi‑Fi, IP address and port 8080.');throw e}finally{clearTimeout(timer)}}
function auth(){if(me&&token)showServerGate();else showAuth()}
function showAuth(){$('app').innerHTML=`<section class="auth"><div class="brand">💥 BANG</div><p class="muted">Friends, nearby. Private conversations with BANG accounts.</p><div class="form"><input class="field" id="u" placeholder="Username"><input class="field" id="n" placeholder="Display name"><input class="field" id="p" type="password" placeholder="Password"><div class="actions"><button class="btn" onclick="signup()">Create account</button><button class="btn secondary" onclick="login()">Log in</button></div><div class="card"><span class="toggle" onclick="toggleConnection()">⚙️ Connection settings</span><div id="connectionSettings" class="hidden" style="margin-top:10px"><p class="muted small">Enter your BANG server address for testing.</p><input class="field" id="api" placeholder="http://192.168.1.10:8080" value="${esc(API)}"><button class="btn secondary" style="margin-top:8px" onclick="testServer()">Test connection</button><div id="testResult" class="muted small" style="margin-top:8px"></div></div></div><div id="err" class="small danger"></div></div></section>`}
function toggleConnection(){$('connectionSettings')?.classList.toggle('hidden')}
async function testServer(){setApi();const out=$('testResult');if(!API){out.textContent='Enter the server address.';return}out.textContent='Testing…';try{const r=await fetch(API+'/healthz',{cache:'no-store'});if(!r.ok)throw new Error();out.textContent='🟢 Server is reachable.'}catch{out.textContent='🔴 Cannot reach server. Start backend and check IP:8080.'}}
async function signup(){setApi();if(!API){$('err').textContent='Enter your BANG server address first.';return}try{const data=await api('/api/signup',{method:'POST',body:JSON.stringify({username:$('u').value.trim(),displayName:$('n').value.trim(),password:$('p').value})});token=data.token;me=data.user;save();showAccountCode()}catch(e){$('err').textContent=e.message}}
async function login(){setApi();if(!API){$('err').textContent='Enter your BANG server address first.';return}try{const data=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('u').value.trim(),password:$('p').value})});token=data.token;me=data.user;save();showServerGate()}catch(e){$('err').textContent=e.message}}
function showAccountCode(){$('app').innerHTML=`<section class="auth"><div class="brand">💥 BANG</div><h1>Account created 🎉</h1><p class="muted">Keep this account code private.</p><div class="card"><div class="muted small">YOUR ACCOUNT CODE</div><div class="code">${esc(me.accountCode||'Generating…')}</div></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="copyAccountCode()">Copy code</button><button class="btn secondary" onclick="showServerGate()">Continue</button></div></section>`}
function copyAccountCode(){navigator.clipboard?.writeText(me.accountCode);toast('Account code copied')}
async function showServerGate(){if(!API){showAuth();return}try{const data=await api('/api/server');window.serverCode=data.serverCode;$('app').innerHTML=`<section class="auth"><div class="brand">💥 BANG</div><h1>Connect to BANG</h1><p class="muted">Logged in as <b>@${esc(me.username)}</b>.</p><div class="card"><div class="muted small">BANG SERVER CODE</div><div class="code">${esc(window.serverCode)}</div></div><div class="form"><input class="field" id="serverCodeInput" placeholder="Enter server code"><button class="btn" onclick="joinServer()">Continue to BANG</button><div id="err" class="small danger"></div></div></section>`}catch(e){$('app').innerHTML=`<section class="auth"><div class="brand">💥 BANG</div><h1>Server unavailable</h1><p class="muted">Your login is saved, but BANG cannot reach the server right now.</p><div id="err" class="small danger">${esc(e.message)}</div><div class="actions" style="margin-top:14px"><button class="btn" onclick="showServerGate()">Retry</button><button class="btn secondary" onclick="showAuth()">Connection settings</button></div></section>`}}
async function joinServer(){const code=$('serverCodeInput').value.trim().toUpperCase();try{await api('/api/server/join',{method:'POST',body:JSON.stringify({code})});localStorage.setItem('bang_server_code',code);showHome()}catch(e){$('err').textContent=e.message}}
function showHome(){$('app').innerHTML=`<header class="top"><div><div class="brand">💥 BANG</div><div class="muted">Private chats. Nearby rooms. No public feed.</div></div><div class="pill" id="connection">⚪ Ready</div></header><section class="layout"><aside class="panel"><div class="profile"><div class="profile-row"><div class="avatar">${esc((me.displayName||me.username)[0].toUpperCase())}</div><div><b>${esc(me.displayName||me.username)}</b><div class="muted">@${esc(me.username)}</div><div class="muted small">${esc(me.accountCode||'')}</div></div></div></div><div class="nav"><button class="active" onclick="chatView()">💬 Chats</button><button onclick="callsView()">📞 Calls</button><button onclick="friendsView()">👥 Friends</button><button onclick="invite()">🔗 Create invite</button><button onclick="settingsView()">⚙️ Settings</button><button onclick="logout()">↪ Log out</button></div></aside><main class="chatbox" id="main"></main></section>`;chatView()}
function chatView(){$('main').innerHTML=`<div class="chat-head"><div><div class="title">Nearby room</div><div class="muted" id="roomStatus">Connect to a BANG server or use Mesh mode.</div></div><span class="pill">🔒 Private</span></div><div class="notice">🛰️ Mesh mode uses BLE for nearby discovery and encrypted links for small text messages.</div><div id="meshPeers" class="card" style="margin:14px 20px 0"><b>📡 Nearby BANG phones</b><div class="muted small" id="meshPeerStatus">Mesh starts automatically in the Android app when permissions are available.</div><div id="meshPeerList" class="list"></div></div><div id="messages" class="messages"></div><div class="composer"><input id="text" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn" id="sendButton" onclick="sendMessage()">Send</button></div><div class="join" style="padding:0 14px 14px"><button class="btn" onclick="connect()">Internet/Server</button><button class="btn secondary" onclick="clearChat()">Clear</button></div>`}
function connect(){if(!API){toast('Set your server in Settings');return}if(!token){toast('Please log in again');showAuth();return}if(ws&&ws.readyState===WebSocket.OPEN){ws.close()}const connection=$('connection'),roomStatus=$('roomStatus'),text=$('text'),sendButton=$('sendButton');if(!connection||!roomStatus||!text||!sendButton)return;const protocol=API.startsWith('https')?'wss':'ws',host=API.replace(/^https?:\/\//,'');ws=new WebSocket(`${protocol}://${host}/?token=${encodeURIComponent(token)}`);connection.textContent='🟡 Connecting…';text.disabled=true;sendButton.disabled=true;ws.onopen=()=>{connection.textContent='🟢 Connected';roomStatus.textContent='Connected to your BANG room';text.disabled=false;sendButton.disabled=false;ws.send(JSON.stringify({type:'join',room:'default'}))};ws.onmessage=event=>{try{const message=JSON.parse(event.data);if(message.type==='chat')addMessage(message.text,false,message.name);if(message.type==='presence')roomStatus.textContent=message.text;if(message.type==='ready')roomStatus.textContent='Connected as @'+message.username}catch{toast('Invalid server response')}};ws.onerror=()=>toast('Unable to connect to the BANG server');ws.onclose=event=>{connection.textContent='⚪ Disconnected';text.disabled=true;sendButton.disabled=true;if(event.code===1008)toast('Session expired. Please log in again.')}}
function sendMessage(){const input=$('text'),message=input?.value.trim();if(!message)return;if(ws&&ws.readyState===WebSocket.OPEN){ws.send(JSON.stringify({type:'chat',text:message}));addMessage(message,true,'You');input.value='';return}if(window.BangMesh){window.BangMesh.send(message);addMessage(message,true,'Mesh');input.value='';return}toast('Connect to BANG or use Mesh mode')}
function addMessage(text,own,label){const messages=$('messages');if(!messages)return;const message=document.createElement('div');message.className='msg'+(own?' me':'');const meta=document.createElement('div');meta.className='meta';meta.textContent=own?'You':label||'BANG';const body=document.createElement('div');body.textContent=text;message.append(meta,body);messages.appendChild(message);messages.scrollTop=messages.scrollHeight}
function clearChat(){if($('messages'))$('messages').innerHTML=''}
function startMesh(){if(!window.BangMesh){toast('Mesh is available in the Android app build');return}window.BangMesh.start()}
function stopMesh(){window.BangMesh?.stop();toast('Mesh stopped')}
function logout(){try{ws?.close()}catch{}ws=null;token='';me=null;localStorage.removeItem('bang_token');localStorage.removeItem('bang_user');showAuth();toast('Logged out')}
function callsView(){$('main').innerHTML='<div class="chat-head"><div class="title">Calls</div></div><div style="padding:20px"><div class="card"><b>📞 BANG Calls</b><p class="muted">Call controls are ready in the Android build; real audio requires both phones to grant microphone permission and have the call transport available.</p></div></div>'}
function friendsView(){$('main').innerHTML='<div class="chat-head"><div class="title">Contacts</div></div><div style="padding:20px"><button class="btn" onclick="loadFriends()">Refresh contacts</button><div id="friendsList" class="list"></div></div>';loadFriends()}
async function loadFriends(){const list=$('friendsList');if(!list)return;try{const data=await api('/api/friends');list.innerHTML='';(data.friends||[]).forEach(f=>{const el=document.createElement('div');el.className='friend';el.textContent='👤 '+(f.displayName||f.username)+' @'+f.username;list.appendChild(el)});(data.incoming||[]).forEach(r=>{const el=document.createElement('div');el.className='friend';const label=document.createElement('span');label.textContent='👋 '+r.from.displayName+' wants to connect';const b=document.createElement('button');b.className='btn';b.textContent='Accept';b.onclick=async()=>{await api('/api/friends/accept',{method:'POST',body:JSON.stringify({id:r.id})});loadFriends()};el.append(label,b);list.appendChild(el)});if(!list.children.length)list.innerHTML='<div class="muted">No contacts yet.</div>'}catch(e){list.textContent=e.message}}
async function invite(){try{const data=await api('/api/invite',{method:'POST'});await navigator.clipboard?.writeText(data.code);toast('Invite code copied: '+data.code)}catch(e){toast(e.message)}}
function settingsView(){$('main').innerHTML=`<div class="chat-head"><div class="title">Settings</div></div><div style="padding:20px"><div class="card"><b>Server</b><p class="muted">${esc(API||'Not configured')}</p><button class="btn secondary" onclick="showAuth()">Change connection</button></div><div class="card"><b>Account</b><p class="muted">@${esc(me?.username||'')}</p><button class="btn secondary" onclick="logout()">Log out</button></div></div>`}
auth();
</script></body></html>
