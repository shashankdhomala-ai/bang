services:
  bang:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DB_FILE: /data/bang-data.json
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:?Set ALLOWED_ORIGIN to your exact HTTPS app origin}
      BANG_SERVER_CODE: ${BANG_SERVER_CODE:?Set a strong random BANG_SERVER_CODE}
    volumes:
      - bang-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      bang:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BANG_DOMAIN: ${BANG_DOMAIN:?Set BANG_DOMAIN to your public backend domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bang-data:
  caddy-data:
  caddy-config:
