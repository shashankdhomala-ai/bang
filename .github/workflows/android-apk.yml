name: BANG Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      BANG_API_URL: ${{ vars.BANG_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: BANG-v1.2-GitHub-Actions-Test
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BANG-debug-apk
          path: BANG-v1.2-GitHub-Actions-Test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Verify release configuration
        working-directory: BANG-v1.2-GitHub-Actions-Test
        run: |
          if [ -z "$BANG_API_URL" ]; then
            echo "BANG_API_URL is not configured; skipping release build." 
            exit 0
          fi
          case "$BANG_API_URL" in
            https://*) ;;
            *) echo "BANG_API_URL must use HTTPS for release builds."; exit 1 ;;
          esac
          gradle --no-daemon assembleRelease
