name: BANG Backend Checks

on:
  push:
    branches: [ main, master ]
    paths:
      - 'BANG-v1.2-GitHub-Actions-Test/backend/**'
      - 'BANG-v1.2-GitHub-Actions-Test/Dockerfile'
      - 'BANG-v1.2-GitHub-Actions-Test/.dockerignore'
      - 'BANG-v1.2-GitHub-Actions-Test/docker-compose.production.yml'
      - 'BANG-v1.2-GitHub-Actions-Test/Caddyfile'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'BANG-v1.2-GitHub-Actions-Test/backend/**'
      - 'BANG-v1.2-GitHub-Actions-Test/Dockerfile'
      - 'BANG-v1.2-GitHub-Actions-Test/.dockerignore'
      - 'BANG-v1.2-GitHub-Actions-Test/docker-compose.production.yml'
      - 'BANG-v1.2-GitHub-Actions-Test/Caddyfile'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: BANG-v1.2-GitHub-Actions-Test/backend/package.json

      - name: Install backend dependencies
        working-directory: BANG-v1.2-GitHub-Actions-Test/backend
        run: npm install --package-lock=false

      - name: Syntax check
        working-directory: BANG-v1.2-GitHub-Actions-Test/backend
        run: npm run check

      - name: Build production container
        working-directory: BANG-v1.2-GitHub-Actions-Test
        run: docker build --pull -t bang-backend:ci .
