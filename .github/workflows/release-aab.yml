name: BANG Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version, e.g. 1.1.0"
        required: true
        type: string
      version_code:
        description: "Integer version code"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-aab:
    runs-on: ubuntu-latest
    env:
      BANG_API_URL: ${{ vars.BANG_API_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
            VERSION_CODE="${GITHUB_RUN_NUMBER}"
          fi
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || { echo "Invalid version code"; exit 1; }
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Validate production API URL
        shell: bash
        run: |
          test -n "$BANG_API_URL" || { echo "Repository variable BANG_API_URL is required."; exit 1; }
          case "$BANG_API_URL" in https://*) ;; *) echo "BANG_API_URL must start with https://"; exit 1 ;; esac

      - name: Validate signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.BANG_KEYSTORE_BASE64 }}" || { echo "Missing BANG_KEYSTORE_BASE64 secret."; exit 1; }
          test -n "${{ secrets.BANG_KEYSTORE_PASSWORD }}" || { echo "Missing BANG_KEYSTORE_PASSWORD secret."; exit 1; }
          test -n "${{ secrets.BANG_KEY_ALIAS }}" || { echo "Missing BANG_KEY_ALIAS secret."; exit 1; }
          test -n "${{ secrets.BANG_KEY_PASSWORD }}" || { echo "Missing BANG_KEY_PASSWORD secret."; exit 1; }

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.BANG_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bang-release.jks"

      - name: Build signed release AAB
        working-directory: BANG-v1.2-GitHub-Actions-Test
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/bang-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.BANG_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BANG_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BANG_KEY_PASSWORD }}
        run: |
          gradle --no-daemon bundleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="$VERSION_CODE"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: BANG-release-${{ env.VERSION_NAME }}
          path: BANG-v1.2-GitHub-Actions-Test/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
